name: Sync to HuggingFace Spaces
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://raytp29:$HF_TOKEN@huggingface.co/spaces/raytp29/big-ambitions-analyzer
          git push hf main --force
